name: DKBDownloaderNative
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  ENABLE_HARDENED_RUNTIME: NO
packages:
  DKBDownloaderCore:
    path: DKBDownloaderCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  DKBDownloaderApp:
    type: application
    platform: macOS
    sources:
      - DKBDownloaderApp
    dependencies:
      - package: DKBDownloaderCore
      - package: Sparkle
    info:
      path: DKBDownloaderApp/Info.plist
      properties:
        # Source of truth for the release version - Info.plist is fully
        # regenerated from this file on every `xcodegen generate` (not
        # merged), so editing Info.plist directly gets silently discarded.
        # scripts/release.sh edits these two lines, not the plist.
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        LSUIElement: false
        # Sparkle (Phase 7). SUPublicEDKey is a placeholder until a real
        # EdDSA keypair is generated — run (see docs/release.md):
        #   sparkle-tools/bin/generate_keys --account dkb-downloader
        # The --account flag is required: without it, generate_keys/sign_update
        # fall back to the Keychain's default "ed25519" account, which is
        # already occupied by DKB Monitor's key — omitting it would silently
        # reuse/sign with the wrong key instead of generating a new one.
        # Releases are signed and uploaded locally (scripts/release.sh) —
        # there is no CI secret for this key.
        # Same domain the old Tauri app's updater used (updates.dangkhoabach.vn),
        # just a different file — not GitHub Releases, this project doesn't
        # publish there. MyWebsiteAPI's AppReleaseService now supports
        # generating this appcast.xml from a manual admin.dangkhoabach.vn
        # upload (installer + Sparkle sig), same as DKB Monitor.
        SUFeedURL: https://updates.dangkhoabach.vn/dkb-downloader/appcast.xml
        SUPublicEDKey: hvmFdDbYmuPf983aZmLLmbqgOIUD8Cqna2g+iJinLLg=
        # Stays off until the real keypair above is in place and at least
        # one release exists — otherwise Sparkle fails every automatic check
        # (no valid feed to reach) and pops an "Unable to Check For Updates"
        # alert on every single launch (bug hit and fixed the same way in
        # DKB Monitor's Phase 10). "Check for Updates…" in the menu bar
        # still works manually in the meantime.
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 86400
    entitlements:
      path: DKBDownloaderApp/DKBDownloaderApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkb-downloader
      PRODUCT_NAME: "DKB Downloader"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postbuildScripts:
      # D12: bundle the existing yt-dlp/ffmpeg sidecar binaries as-is into
      # Contents/Resources/bin — no rebuild/re-download. Both are fetched by
      # scripts/fetch-sidecars.sh into vendor/binaries/, gitignored there
      # (large, self-updating) so a fresh CI checkout won't have them; this
      # script skips (with a warning) rather than failing the build when
      # they're absent — native-ci.yml only needs the app to compile/link,
      # not to actually run downloads.
      - name: "Bundle yt-dlp/ffmpeg sidecar binaries"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          BINARIES_DIR="${SRCROOT}/vendor/binaries"
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/bin"
          mkdir -p "$DEST"

          # yt-dlp_macos is already a universal (arm64+x86_64) binary —
          # fetch-sidecars.sh just copies it under both target-triple names
          # for Tauri's sidecar convention, so either copy is identical.
          if [ -f "$BINARIES_DIR/yt-dlp-aarch64-apple-darwin" ]; then
            cp "$BINARIES_DIR/yt-dlp-aarch64-apple-darwin" "$DEST/yt-dlp"
            chmod +x "$DEST/yt-dlp"
          else
            echo "warning: yt-dlp sidecar not found at $BINARIES_DIR — run scripts/fetch-sidecars.sh (skipping bundle)"
          fi

          # evermeet.cx only publishes x86_64 ffmpeg — runs fine via Rosetta
          # 2 on Apple Silicon, same file under both target-triple names.
          if [ -f "$BINARIES_DIR/ffmpeg-x86_64-apple-darwin" ]; then
            cp "$BINARIES_DIR/ffmpeg-x86_64-apple-darwin" "$DEST/ffmpeg"
            chmod +x "$DEST/ffmpeg"
          else
            echo "warning: ffmpeg sidecar not found at $BINARIES_DIR — run scripts/fetch-sidecars.sh (skipping bundle)"
          fi
